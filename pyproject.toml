[project]
name = "competitive-programming"
version = "1.0.0"
description = "Algorithms and data structures in Python: tested solutions to LeetCode, HackerRank, GeeksforGeeks and Codeforces problems."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hussen Mohammed" }]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
